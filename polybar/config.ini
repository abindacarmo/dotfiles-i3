[colors]
background = #00000000
foreground = ${xrdb:color7}
primary    = ${xrdb:color1}
secondary  = ${xrdb:color2}
alert      = ${xrdb:color3}
disabled   = ${xrdb:color8}
module-bg  = #aa000000

[bar/top]
monitor        = eDP-1
width          = 99.99%
height         = 28pt
offset-x       = 2%
offset-y       = 8
radius         = 16
fixed-center   = true
background     = ${colors.module-bg}
foreground     = ${colors.foreground}
padding-left   = 2
padding-right  = 2
module-margin  = 1
font-0         = JetBrainsMono Nerd Font:size=10;2
font-1         = JetBrainsMono Nerd Font:size=14;3
modules-left   = xworkspaces xwindow
modules-center = date
modules-right  = memory cpu battery wlan pulseaudio
cursor-click   = pointer
cursor-scroll  = ns-resize
enable-ipc     = true
override-redirect = false

[module/xworkspaces]
type = internal/xworkspaces
label-active            = " %name% "
label-active-foreground = ${colors.primary}
label-active-padding    = 1
label-occupied          = " %name% "
label-occupied-foreground = ${colors.secondary}
label-occupied-padding  = 1
label-urgent            = " %name% "
label-urgent-foreground = ${colors.alert}
label-urgent-padding    = 1
label-empty             = " %name% "
label-empty-foreground  = ${colors.disabled}
label-empty-padding     = 1

[module/xwindow]
type = internal/xwindow
label            = " %title:0:40:...% "
label-foreground = ${colors.foreground}
label-padding    = 1

[module/memory]
type = internal/memory
interval = 2
format-prefix          = " 󰍛 "
format-prefix-foreground = ${colors.primary}
label                  = "%percentage_used%% "
label-foreground       = ${colors.foreground}
label-padding          = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix          = "  "
format-prefix-foreground = ${colors.primary}
label                  = "%percentage%% "
label-foreground       = ${colors.foreground}
label-padding          = 1

[module/battery]
type = internal/battery
battery  = BAT0
adapter  = AC
full-at  = 98
label-charging    = " 󰂄 %percentage%% "
label-charging-foreground = ${colors.secondary}
label-charging-padding    = 1
label-discharging = " 󰁹 %percentage%% "
label-discharging-foreground = ${colors.primary}
label-discharging-padding    = 1
label-full        = " 󰁹 Full "
label-full-foreground = ${colors.primary}
label-full-padding    = 1

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
label-connected = " 󰤨 %essid% "
label-connected-foreground = ${colors.primary}
label-connected-padding = 1
label-disconnected = " 󰤭 offline "
label-disconnected-foreground = ${colors.disabled}
label-disconnected-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " 󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume            = "%percentage%% "
label-volume-foreground = ${colors.foreground}
label-volume-padding    = 1
label-muted             = " 󰖁 muted "
label-muted-foreground  = ${colors.disabled}
label-muted-padding     = 1

[module/date]
type = internal/date
interval = 1
date     = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label            = "  %date% "
label-foreground = ${colors.primary}
label-padding    = 1
click-left = gsimplecal
click-right = dunstctl history-pop

[settings]
screenchange-reload = true
pseudo-transparency = true
